name = "shopmallx"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "shopmallx-db"
database_id = "cc658e57-35aa-47b3-97fd-9316e38c78a4"

# R2 bucket for user-uploaded images (products / categories / banners / promotions)
[[r2_buckets]]
binding = "R2"
bucket_name = "shopmallx"

# Public base URL for the bucket — set R2_PUBLIC_BASE via
#   wrangler pages secret put R2_PUBLIC_BASE
# Example value: https://pub-xxxx.r2.dev   (R2 public dev subdomain)
# Or your custom domain: https://cdn.yourdomain.tld

# Secrets — set with `wrangler pages secret put NAME`
# JWT_SECRET